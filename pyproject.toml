[project]
name = "weather-router"
version = "0.1.0"
description = "Operator-controlled weather broadcast director"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["Flask>=3.0", "requests>=2.31", "Pillow>=10.0"]

[project.scripts]
weather-router = "weather_router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
weather_router = ["templates/*.html", "static/*.css"]
