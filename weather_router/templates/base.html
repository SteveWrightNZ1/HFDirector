<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weather Router{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='router.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('dashboard') }}">Weather Router</a>
    <nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('source_viewer') }}">Sources</a><a href="{{ url_for('bsr_list') }}">BSR / FIX</a></nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}{% if messages %}
      <div class="messages">{% for message in messages %}<div>{{ message }}</div>{% endfor %}</div>
    {% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
