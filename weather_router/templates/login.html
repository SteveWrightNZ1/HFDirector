<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Weather Router</title><link rel="stylesheet" href="{{ url_for('static',filename='router.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='management.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='auth.css') }}"></head>
<body class="login-page"><main class="login-shell"><section class="login-panel"><div class="login-mark">WR</div><p class="eyebrow">Station management</p><h1>Weather Router</h1><p class="muted">Sign in to operate the weather transmission system.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="messages">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" autocomplete="username" autofocus required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form></section></main></body></html>
